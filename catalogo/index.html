      if (inp) inp.setAttribute('aria-invalid', mensaje ? 'true' : 'false');
      return !mensaje;
    }

    function enviarPedido() {
      // Un pedido mandado dos veces son dos pedidos: el comerciante prepara el
      // doble y se entera cuando el cliente le dice que no. El `id_remoto` lo
      // atajaría del lado del POS, pero solo si el segundo envío lleva el
      // mismo, y un doble clic genera dos. Se frena acá.
      if (enviando) return;

      const nombre   = $('f-nombre').value.trim();
      const contacto = $('f-contacto').value.trim();
      const esEnvio  = envioElegido();
      const direccion = esEnvio ? ($('f-direccion')?.value || '').trim() : '';
      const nota     = $('f-nota').value.trim();

      let ok = true;
      ok = marcarError('nombre',   nombre.length >= 3 ? '' : 'Poné tu nombre y apellido.') && ok;
      ok = marcarError('contacto', contacto.length >= 6 ? '' : 'Dejá un teléfono o un email para que te confirmen.') && ok;
      if (esEnvio) ok = marcarError('direccion', direccion.length >= 5 ? '' : 'Sin dirección no podemos enviarlo.') && ok;
      if (!ok) {
        document.querySelector('[aria-invalid="true"]')?.focus();
        return;
      }
      if (!carrito.length) { vista = 'lista'; pintarCarrito(); return; }

      const env = costoEnvio(esEnvio);
      const ahora = new Date();
      const dd = n => String(n).padStart(2, '0');
      const pedido = {
        id_remoto: nuevoId(),
        comercio:  clientId,
        // El POS guarda las fechas como dd/mm/aaaa. Mandarlas en ISO obligaría
        // al backend a saber de formatos, y el backend tiene que ser tonto.
        fecha: `${dd(ahora.getDate())}/${dd(ahora.getMonth() + 1)}/${ahora.getFullYear()}`,
        hora:  `${dd(ahora.getHours())}:${dd(ahora.getMinutes())}`,
        cliente: nombre,
        contacto: contacto,
        entrega: esEnvio ? 'envio' : 'retira',
        direccion: direccion,
        zona: esEnvio ? (pedCfg.zona || '') : '',
        costo_envio: env,
        total: subtotal() + env,
        nota: nota,
        lineas: carrito.map(l => ({
          producto: l.nombre,          // el POS lo busca por NOMBRE exacto
          cantidad: l.cantidad,
          precio:   l.precio,          // el precio que el cliente VIO
        })),
      };

      enviando = true;
      const btn = $('cart-enviar');
      const etiqueta = btn.textContent;
      btn.disabled = true;
      btn.textContent = 'Enviando…';

      const terminar = () => {
        ultimoId = pedido.id_remoto;
        carrito = [];
        guardarCarrito();
        pintarContador();
        enviando = false;
        vista = 'ok';
        pintarCarrito();
      };

      const fallar = (motivo) => {
        enviando = false;
        btn.disabled = false;
        btn.textContent = etiqueta;
        const err = $('e-general');
        if (err) {
          err.textContent = motivo;
          err.hidden = false;
        }
      };

      if (pedCfg.endpoint) {
        enviarAlServicio(pedido).then(terminar).catch(e => {
          console.error(e);
          // El pedido NO se pierde: el carrito queda como estaba y el cliente
          // puede reintentar o mandarlo por WhatsApp. Vaciarlo acá sería
          // borrarle el pedido a alguien por un problema de red nuestro.
          fallar('No pudimos enviar el pedido. Revisá tu conexión y probá de nuevo, o escribinos por WhatsApp.');
        });
      } else {
        // Sin backend (NQ-71 todavía no existe): sale por WhatsApp.
        abrirWhatsApp(pedido);
        terminar();
      }
    }

    // Un id opaco y sin colisiones prácticas. No sale del nombre ni del
    // contacto: si se derivara de los datos del cliente, dos pedidos suyos
    // seguidos serían "el mismo" para el POS y el segundo se descartaría como
    // duplicado.
    function nuevoId() {
      const azar = (crypto && crypto.getRandomValues)
        ? Array.from(crypto.getRandomValues(new Uint8Array(4)))
            .map(b => b.toString(16).padStart(2, '0')).join('')
        : Math.random().toString(16).slice(2, 10);
      return `web-${Date.now().toString(36)}-${azar}`.toUpperCase();
    }

    async function enviarAlServicio(pedido) {
      const ctrl = new AbortController();
      // Sin tope, un backend que no responde deja el botón en "Enviando…" para
      // siempre y el cliente cierra la página creyendo que mandó el pedido.
      const reloj = setTimeout(() => ctrl.abort(), 15000);
      try {
        const res = await fetch(pedCfg.endpoint, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(pedido),
          signal: ctrl.signal,
        });
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        return true;
      } finally {
        clearTimeout(reloj);
      }
    }

    function abrirWhatsApp(pedido) {
      const nl = '\n';
      const lineas = pedido.lineas.map(l =>
        `• ${l.cantidad} x ${l.producto} — ${fmt(l.cantidad * l.precio)}`).join(nl);
      const partes = [
        `*Pedido web* ${pedido.id_remoto}`,
        `${pedido.fecha} ${pedido.hora}`,
        '',
        lineas,
        '',
        pedido.entrega === 'envio'
          ? `Envío a: ${pedido.direccion}${pedido.zona ? ` (${pedido.zona})` : ''}` +
            (pedido.costo_envio > 0 ? `${nl}Costo de envío: ${fmt(pedido.costo_envio)}` : '')
          : 'Retiro por el local',
        `*Total: ${fmt(pedido.total)}*`,
        '',
        `Nombre: ${pedido.cliente}`,
        `Contacto: ${pedido.contacto}`,
      ];
      if (pedido.nota) partes.push(`Nota: ${pedido.nota}`);
      const texto = encodeURIComponent(partes.join(nl));
      const num = String(catalogMeta.wpp_numero || '').replace(/\D/g, '');
      // Sin número cargado, wa.me abre el selector de contacto de WhatsApp. No
      // es lo ideal, pero es mejor que un enlace roto: el cliente elige el
      // contacto del comercio y el mensaje ya va escrito.
      const url = num ? `https://wa.me/${num}?text=${texto}`
                      : `https://wa.me/?text=${texto}`;
      window.open(url, '_blank', 'noopener');
    }

    loadCatalog();
  </script>
</body>
</html>
